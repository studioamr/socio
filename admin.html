<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NORTHPOINT · SOCIO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23F4F4F4' font-family='monospace'>N</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808; --panta:#0E0E0E; --basec:#1E1E1E; --bisel:#232323;
    --txt:#F4F4F4; --dim:#7C7C7C; --faint:#585858;
    --up:#57C79B; --down:#DE6A5F; --warn:#D9A441;
    --sans:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);min-height:100vh;padding:18px 16px 120px;max-width:560px;margin:0 auto}
  .micro{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500}

  .brand{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--bisel);margin-bottom:18px}
  .brand b{font-size:13px;font-weight:600;letter-spacing:.09em}
  .brand .sub{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--dim);margin-top:3px}
  .brand a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-decoration:none}
  .brand a:active{color:var(--txt)}

  .card{background:linear-gradient(180deg,#101010,#0B0B0B);border:1px solid var(--bisel);border-radius:12px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px)}
  .card .micro{display:block;margin-bottom:12px}

  /* flota */
  .flota{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .cta{aspect-ratio:1;border-radius:8px;border:1px dashed var(--bisel);background:#0B0B0B;color:var(--faint);font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:border-color .15s}
  .cta b{font-size:11px;font-weight:600;color:var(--txt)}
  .cta.examen{border:1px solid #3A3A3A;background:#121212;color:var(--dim)}
  .cta.pasada{border:1px solid #4A3A14;background:#141005;color:var(--warn)}
  .cta.activa{border:1px solid #1B4A36;background:#07130E;color:var(--up)}
  .cta.activa b{color:var(--up)}
  .cta.caida{border:1px solid #4A211B;background:#130908;color:var(--down);opacity:.8}
  .cta:active{transform:scale(.96)}
  .flota-res{margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
  .hint{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.04em;margin-top:8px;line-height:1.7;text-transform:uppercase}

  label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:12px 0 6px}
  input,select{width:100%;background:#0A0A0A;border:1px solid var(--bisel);border-radius:8px;padding:11px 12px;color:var(--txt);font-family:var(--mono);font-size:14px;outline:none;appearance:none}
  input:focus,select:focus{border-color:#3E3E3E}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{width:100%;border:1px solid var(--bisel);background:transparent;border-radius:9px;padding:12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--txt);cursor:pointer;margin-top:12px}
  .btn:active{transform:scale(.98);background:#141414}

  .fila{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #161616;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .fila:last-child{border-bottom:none}
  .fila b{color:var(--txt);font-weight:500}
  .fila .up{color:var(--up)} .fila .warn{color:var(--warn)}
  .fila button{background:none;border:1px solid var(--bisel);border-radius:6px;color:var(--down);font-family:var(--mono);font-size:10px;padding:3px 8px;cursor:pointer}

  .plomeria{display:flex;gap:8px;align-items:center}
  .plomeria input{flex:1}
  .plomeria .btn{width:auto;margin:0;padding:11px 14px;white-space:nowrap}

  .barra{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,8,.92);backdrop-filter:blur(10px);border-top:1px solid var(--bisel);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
  .barra .estado{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);line-height:1.5}
  .barra .estado.ok{color:var(--up)}
  .btn-pri{background:#F2F2F2;color:#0A0A0A;border:none;border-radius:9px;padding:13px 24px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;font-weight:600;cursor:pointer}
  .btn-pri:active{transform:scale(.98);background:#FFFFFF}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1A1A1A;border:1px solid var(--bisel);color:var(--txt);padding:11px 18px;border-radius:9px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;z-index:99;display:none;max-width:92vw;text-align:center}
  .toast.on{display:block}
</style>
</head>
<body>

<div class="brand">
  <div><b>NORTHPOINT</b><span class="sub">SOCIO · APEX FLEET</span></div>
  <a href="index.html">← TABLERO</a>
</div>

<div class="card">
  <span class="micro">Flota — 20 cuentas 50K</span>
  <div class="flota" id="flota"></div>
  <div class="flota-res" id="flotaRes"></div>
  <div class="hint">Toca una cuenta para rotar: vacía → examen → pasada → activa → caída → vacía</div>
</div>

<div class="card">
  <span class="micro">Registrar gasto</span>
  <div class="dos">
    <div><label>Monto USD</label><input id="gMonto" type="number" inputmode="decimal" placeholder="380"></div>
    <div><label>Fecha</label><input id="gFecha" placeholder="19-AGO"></div>
  </div>
  <label>Concepto</label>
  <input id="gConcepto" placeholder="4 packs de exámenes (20 ctas)">
  <button class="btn" id="btnGasto">+ Gasto</button>
  <div id="gastosLista" style="margin-top:8px"></div>
</div>

<div class="card">
  <span class="micro">Registrar pago de Apex</span>
  <div class="dos">
    <div><label>Monto USD</label><input id="pMonto" type="number" inputmode="decimal" placeholder="520"></div>
    <div><label>Fecha</label><input id="pFecha" placeholder="5-SEP"></div>
  </div>
  <div class="dos">
    <div><label>Cuenta</label><input id="pCuenta" placeholder="A1"></div>
    <div><label>Estado</label><select id="pEstado"><option value="proceso">EN PROCESO</option><option value="pagado">PAGADO ✓</option></select></div>
  </div>
  <button class="btn" id="btnPayout">+ Pago</button>
  <div id="payoutsLista" style="margin-top:8px"></div>
</div>

<div class="card">
  <span class="micro">Conexión</span>
  <div class="plomeria">
    <input id="fToken" type="password" placeholder="github_pat_…">
    <button class="btn" id="btnProbar">Probar</button>
  </div>
</div>

<div class="barra">
  <div class="estado" id="estadoPub">SIN CAMBIOS</div>
  <button class="btn-pri" id="btnPublicar">PUBLICAR</button>
</div>

<div class="toast" id="toast"></div>

<script>
const GH={owner:'studioamr',repo:'socio',branch:'main',file:'datos.json'};
const $=id=>document.getElementById(id);
const usd=n=>'$'+(+n||0).toLocaleString('en-US');
let D=null;
const ESTADOS=[null,'examen','pasada','activa','caida'];

const m=location.hash.match(/token=([^&\s]+)/);
if(m){ localStorage.setItem('socio_token',decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); }

async function init(){
  $('fToken').value=localStorage.getItem('socio_token')||'';
  try{ D=await (await fetch('datos.json?v='+Date.now())).json(); }
  catch(e){ D={cuentas:[],gastos:[],payouts:[]}; }
  D.cuentas=D.cuentas||[]; D.gastos=D.gastos||[]; D.payouts=D.payouts||[];
  const local=localStorage.getItem('socio_borrador');
  if(local){ try{ const L=JSON.parse(local); if(confirm('Hay cambios sin publicar. ¿Recuperarlos?')) D=L; else localStorage.removeItem('socio_borrador'); }catch(e){} }
  pintarFlota(); pintarListas();
  if(m) toast('✓ CÓDIGO DE CONEXIÓN GUARDADO');
}

function pintarFlota(){
  const f=$('flota'); f.innerHTML='';
  let c={examen:0,pasada:0,activa:0,caida:0};
  for(let i=0;i<20;i++){
    const cta=D.cuentas[i];
    if(cta) c[cta.estado]=(c[cta.estado]||0)+1;
    const b=document.createElement('button');
    b.className='cta '+(cta?cta.estado:'');
    b.innerHTML='<b>A'+(i+1)+'</b>'+(cta?({examen:'EXAM',pasada:'PASADA',activa:'ACTIVA',caida:'CAÍDA'}[cta.estado]||''):'·');
    b.onclick=()=>{
      const actual=D.cuentas[i]?ESTADOS.indexOf(D.cuentas[i].estado):0;
      const sig=ESTADOS[(actual+1)%ESTADOS.length];
      D.cuentas[i]=sig?{id:'A'+(i+1),estado:sig}:null;
      while(D.cuentas.length&&!D.cuentas[D.cuentas.length-1]) D.cuentas.pop();
      cambio(); pintarFlota();
    };
    f.appendChild(b);
  }
  $('flotaRes').textContent=`${c.activa} ACTIVAS · ${c.pasada} PASADAS · ${c.examen} EXAMEN · ${c.caida} CAÍDAS`;
}

function pintarListas(){
  $('gastosLista').innerHTML=D.gastos.map((g,i)=>`<div class="fila"><span>${esc(g.fecha||'')} · ${esc(g.concepto||'')}</span><span><b>${usd(g.monto)}</b> <button onclick="quitar('gastos',${i})">×</button></span></div>`).join('');
  $('payoutsLista').innerHTML=D.payouts.map((p,i)=>`<div class="fila"><span>${esc(p.fecha||'')} · ${esc(p.cuenta||'')}</span><span class="${p.estado==='pagado'?'up':'warn'}">${p.estado==='pagado'?'✓':'PROC'}</span><span><b>${usd(p.monto)}</b> <button onclick="quitar('payouts',${i})">×</button></span></div>`).join('');
}
window.quitar=(k,i)=>{ D[k].splice(i,1); cambio(); pintarListas(); };

$('btnGasto').onclick=()=>{
  const monto=parseFloat($('gMonto').value); if(!monto) return alert('Falta el monto');
  D.gastos.push({fecha:$('gFecha').value.trim(),concepto:$('gConcepto').value.trim(),monto});
  $('gMonto').value=$('gConcepto').value='';
  cambio(); pintarListas();
};
$('btnPayout').onclick=()=>{
  const monto=parseFloat($('pMonto').value); if(!monto) return alert('Falta el monto');
  D.payouts.push({fecha:$('pFecha').value.trim(),cuenta:$('pCuenta').value.trim().toUpperCase(),estado:$('pEstado').value==='pagado'?'pagado':'proceso',monto});
  $('pMonto').value=$('pCuenta').value='';
  cambio(); pintarListas();
};
$('fToken').addEventListener('change',()=>localStorage.setItem('socio_token',$('fToken').value.trim()));

function cambio(){
  localStorage.setItem('socio_borrador',JSON.stringify(D));
  const e=$('estadoPub'); e.textContent='CAMBIOS SIN PUBLICAR'; e.classList.remove('ok');
}

async function gh(path,opts={}){
  const token=localStorage.getItem('socio_token')||'';
  if(!token) throw new Error('Falta el código de conexión.');
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',...(opts.headers||{})}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,120));
  return r.json();
}
$('btnProbar').onclick=async()=>{
  try{ await gh(`/repos/${GH.owner}/${GH.repo}`); toast('✓ CONEXIÓN LISTA'); }
  catch(e){ alert('No conectó: '+e.message); }
};
$('btnPublicar').onclick=async()=>{
  try{
    $('estadoPub').textContent='PUBLICANDO…';
    D.actualizado=new Date().toISOString();
    const meta=await gh(`/repos/${GH.owner}/${GH.repo}/contents/${GH.file}?ref=${GH.branch}`);
    const contenido=btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1))));
    await gh(`/repos/${GH.owner}/${GH.repo}/contents/${GH.file}`,{method:'PUT',body:JSON.stringify({
      message:'Fleet: actualización',content:contenido,sha:meta.sha,branch:GH.branch})});
    localStorage.removeItem('socio_borrador');
    const e=$('estadoPub'); e.textContent='✓ PUBLICADO — EN EL TABLERO EN ~1 MIN'; e.classList.add('ok');
    toast('✓ PUBLICADO');
  }catch(e){
    $('estadoPub').textContent='ERROR AL PUBLICAR';
    alert('No se pudo publicar: '+e.message);
  }
};

function esc(s){ return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
let tt;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),3000); }
init();
</script>
</body>
</html>
